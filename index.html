<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maafin Gua Ya 🥺</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    background:linear-gradient(135deg,#ffd6e7,#fff7fb);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.card{
    width:90%;
    max-width:420px;
    background:#fff;
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 35px rgba(255,120,150,.25);
    position:relative;
}

.cat{
    font-size:95px;
    animation:float 2s ease-in-out infinite;
}

.eyes{
    font-size:28px;
    animation:blink 3s infinite;
    margin-top:-15px;
}

h1{
    color:#ff5b8f;
    margin:15px 0;
}

p{
    color:#666;
    line-height:1.6;
    margin-bottom:25px;
}

button{
    background:#ff5b8f;
    color:white;
    border:none;
    padding:12px 35px;
    border-radius:50px;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff3d77;
}

.hidden{
    display:none;
}

@keyframes float{
    0%,100%{
        transform:translateY(0px) rotate(-3deg);
    }
    50%{
        transform:translateY(-12px) rotate(3deg);
    }
}

@keyframes blink{
    0%,45%,100%{
        opacity:1;
    }
    47%,49%{
        opacity:0;
    }
}

.heart{
    position:absolute;
    color:#ff8db3;
    animation:fall linear infinite;
    opacity:.7;
}

@keyframes fall{
    from{
        transform:translateY(-120px);
    }
    to{
        transform:translateY(100vh);
    }
}
</style>
</head>
<body>

<div class="card">

<div id="page1">

<div class="cat">🐱</div>

<h1>Gua Minta Maaf...</h1>

<p>
Kalau gua bikin dek Vio badmood,
Gua benar-benar minta maaf loh.
</p>

<button onclick="nextPage()">Next ❤️</button>

</div>

<div id="page2" class="hidden">

<div class="eyes">🥹</div>

<h1>Maafin Gua Ya...</h1>

<p>
Gua sampe buat ginian, maafin gua ya, dek Vio? Serius loh ini.. 😔
</p>

</div>

</div>

<script>

function nextPage(){
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
}

function createHeart(){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML=Math.random()>0.5?"❤":"💕";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    heart.style.animationDuration=(4+Math.random()*3)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);
}

setInterval(createHeart,350);

</script>

</body>
</html>
